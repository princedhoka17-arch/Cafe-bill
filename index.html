<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewline – Cafe Billing Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ef;--panel:#fff;--ink:#1b2321;--mute:#6b7773;--line:#dbe1de;--green:#14342d;--green2:#1f4d42;--amber:#e8a23a;--amber-ink:#3b2606;--red:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--panel:#17211e;--ink:#e8eeeb;--mute:#93a29c;--line:#2a3733;--green:#0b231e;--green2:#2b6b5a;--amber-ink:#2a1a03}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,serif;margin:0}
header{background:var(--green);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:22px}header small{opacity:.7}
nav{margin-left:auto;display:flex;gap:6px}
nav button{background:transparent;border:1px solid #ffffff44;color:#fff;padding:7px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:1fr 360px;gap:14px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.cats button{white-space:nowrap;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:16px;font:inherit;cursor:pointer}
.cats button.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);font:inherit}
.item:hover{border-color:var(--green2)}.item b{display:block}.item span{color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:var(--bg);color:var(--ink);padding:8px;font:inherit;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}.line .q{display:flex;align-items:center;gap:6px}
.q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font:700 20px 'Bricolage Grotesque',serif;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.pay{width:100%;background:var(--amber);color:var(--amber-ink);border:0;border-radius:10px;padding:13px;font:700 16px 'DM Sans';cursor:pointer;margin-top:8px}
.pay:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats div{background:var(--bg);border-radius:10px;padding:12px}.stats b{display:block;font:700 22px 'Bricolage Grotesque',serif}
.stats span{color:var(--mute);font-size:13px}
.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
#modal.show{display:flex}
.sheet{background:#fff;color:#111;width:100%;max-width:400px;border-radius:6px;padding:20px;font-family:'DM Sans',sans-serif}
.sheet h2{text-align:center;font-size:24px}.sheet .c{text-align:center;font-size:12px;color:#555}
.sheet hr{border:0;border-top:1px dashed #999;margin:10px 0}
.sheet .r{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.sheet .big{font:700 18px 'Bricolage Grotesque',serif}
.qr{width:64px;height:64px;margin:8px auto 0;background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/16px 16px;border:4px solid #fff;outline:1px solid #111}
.acts{max-width:400px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts button{padding:11px;border-radius:8px;border:0;font:700 14px 'DM Sans';cursor:pointer}
.wa{background:#1f9d55;color:#fff}.em{background:#2f6fd0;color:#fff}.pr{background:#fff;color:#111}.cl{background:#ffffff33;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;border-radius:24px;display:none;z-index:30;max-width:90%;text-align:center}
@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}#modal{position:absolute;background:none;display:block}.sheet{position:absolute;left:0;top:0}}
</style>
</head>
<body>
<header>
  <div><h1>Brewline</h1><small>Cafe billing demo</small></div>
  <nav><button id="t1" class="on">Billing</button><button id="t2">Sales today</button></nav>
</header>

<main id="v1">
  <section class="panel">
    <div class="cats" id="cats"></div>
    <div class="grid" id="menu"></div>
  </section>
  <aside class="panel">
    <div class="seg" id="otype"></div>
    <div class="row"><select id="table"></select><input id="phone" inputmode="tel" placeholder="Customer phone"></div>
    <input id="email" type="email" placeholder="Customer email (optional)" style="margin-bottom:8px">
    <div id="lines"></div>
    <div class="row" style="margin-top:10px"><input id="coupon" placeholder="Coupon (try CAFE10)"><button class="ghost" id="apply">Apply</button></div>
    <div class="tot" id="tot"></div>
    <div class="seg" id="pmode" style="margin-top:8px"></div>
    <button class="pay" id="pay" disabled>Charge and generate bill</button>
  </aside>
</main>

<main id="v2" style="display:none">
  <section class="panel wide">
    <div class="stats" id="stats"></div>
    <h3 style="margin-bottom:8px">Bills</h3>
    <div class="scroll"><table><thead><tr><th>Bill no.</th><th>Time</th><th>Type</th><th>Paid by</th><th>Total</th><th></th></tr></thead><tbody id="bills"></tbody></table></div>
    <div class="empty" id="nobills">No bills yet. Create one from the Billing tab.</div>
  </section>
</main>

<div id="modal"><div style="width:100%;max-width:400px">
  <div class="sheet" id="sheet"></div>
  <div class="acts">
    <button class="wa" id="wa">Send on WhatsApp</button><button class="em" id="em">Send by email</button>
    <button class="pr" id="pr">Save as PDF</button><button class="cl" id="cl">New order</button>
  </div>
</div></div>
<div id="toast"></div>

<script>
const MENU=[
 {n:'Espresso',p:120,c:'Coffee'},{n:'Cappuccino',p:170,c:'Coffee'},{n:'Cafe latte',p:180,c:'Coffee'},{n:'Cold brew',p:200,c:'Coffee'},
 {n:'Masala chai',p:90,c:'Tea & more'},{n:'Matcha latte',p:220,c:'Tea & more'},{n:'Hot chocolate',p:190,c:'Tea & more'},
 {n:'Butter croissant',p:140,c:'Bakery'},{n:'Blueberry muffin',p:130,c:'Bakery'},{n:'Cheesecake slice',p:210,c:'Bakery'},
 {n:'Veg grilled sandwich',p:190,c:'Food'},{n:'Paneer wrap',p:230,c:'Food'},{n:'Pasta alfredo',p:310,c:'Food'}];
const CATS=['All',...new Set(MENU.map(m=>m.c))];
const TYPES=['Dine-in','Takeaway','Delivery'],PAYS=['Cash','Card','UPI'];
const S={cat:'All',type:'Dine-in',pay:'UPI',cart:{},disc:0,bills:[],seq:1};
const $=id=>document.getElementById(id);
const inr=n=>'₹'+n.toFixed(2);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function seg(el,list,key){el.innerHTML=list.map(x=>`<button class="${S[key]===x?'on':''}" data-v="${x}">${x}</button>`).join('');
 el.onclick=e=>{const v=e.target.dataset.v;if(v){S[key]=v;seg(el,list,key);if(key==='type')tableState()}}}
function tableState(){$('table').style.display=S.type==='Dine-in'?'':'none'}
$('table').innerHTML=Array.from({length:10},(_,i)=>`<option>Table ${i+1}</option>`).join('');
function drawMenu(){
 $('cats').innerHTML=CATS.map(c=>`<button class="${S.cat===c?'on':''}" data-v="${c}">${c}</button>`).join('');
 $('menu').innerHTML=MENU.map((m,i)=>({m,i})).filter(x=>S.cat==='All'||x.m.c===S.cat)
  .map(x=>`<button class="item" data-i="${x.i}"><b>${x.m.n}</b><span>${inr(x.m.p)}</span></button>`).join('')}
$('cats').onclick=e=>{if(e.target.dataset.v){S.cat=e.target.dataset.v;drawMenu()}};
$('menu').onclick=e=>{const b=e.target.closest('.item');if(b){const i=b.dataset.i;S.cart[i]=(S.cart[i]||0)+1;drawCart()}};
function calc(){let sub=0;Object.entries(S.cart).forEach(([i,q])=>sub+=MENU[i].p*q);
 const d=sub*S.disc,tx=(sub-d)*0.05,total=Math.round(sub-d+tx);return{sub,d,tx,total,round:total-(sub-d+tx)}}
function drawCart(){
 const ent=Object.entries(S.cart);
 $('lines').innerHTML=ent.length?ent.map(([i,q])=>`<div class="line"><div class="n">${MENU[i].n}<br><small style="color:var(--mute)">${inr(MENU[i].p)}</small></div>
  <div class="q"><button data-i="${i}" data-d="-1" aria-label="Remove one">−</button>${q}<button data-i="${i}" data-d="1" aria-label="Add one">+</button></div>
  <b>${inr(MENU[i].p*q)}</b></div>`).join(''):'<div class="empty">Tap items on the menu to start an order.</div>';
 const c=calc();
 $('tot').innerHTML=`<div><span>Subtotal</span><span>${inr(c.sub)}</span></div>`+(c.d?`<div><span>Discount (${S.disc*100}%)</span><span>−${inr(c.d)}</span></div>`:'')+
  `<div><span>GST 5%</span><span>${inr(c.tx)}</span></div><div><span>Round off</span><span>${inr(c.round)}</span></div><div class="g"><span>Total</span><span>${inr(c.total)}</span></div>`;
 $('pay').disabled=!ent.length;$('pay').textContent=ent.length?`Charge ${inr(c.total)} and generate bill`:'Charge and generate bill'}
$('lines').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=b.dataset.i;S.cart[i]+=+b.dataset.d;if(S.cart[i]<=0)delete S.cart[i];drawCart()};
$('apply').onclick=()=>{if($('coupon').value.trim().toUpperCase()==='CAFE10'){S.disc=.1;toast('Coupon applied: 10% off')}else{S.disc=0;toast('Coupon not valid. Try CAFE10.')}drawCart()};

let cur=null;
$('pay').onclick=()=>{
 const c=calc(),now=new Date(),no='BRW-'+now.getFullYear()+'-'+String(S.seq++).padStart(4,'0');
 cur={no,now,c,type:S.type,pay:S.pay,table:S.type==='Dine-in'?$('table').value:'',phone:$('phone').value.trim(),email:$('email').value.trim(),
  items:Object.entries(S.cart).map(([i,q])=>({n:MENU[i].n,q,p:MENU[i].p}))};
 S.bills.unshift(cur);showBill();};
function showBill(){
 const b=cur,dt=b.now.toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
 $('sheet').innerHTML=`<h2>Brewline Cafe</h2><div class="c">12 Park Street, Indiranagar, Bengaluru<br>GSTIN 29ABCDE1234F1Z5 · Ph 98765 43210</div><hr>
 <div class="r"><span>Bill no.</span><b>${b.no}</b></div><div class="r"><span>Date</span><span>${dt}</span></div>
 <div class="r"><span>${b.type}</span><span>${b.table}</span></div>${b.phone?`<div class="r"><span>Customer</span><span>${b.phone}</span></div>`:''}<hr>
 ${b.items.map(i=>`<div class="r"><span>${i.q} × ${i.n}</span><span>${inr(i.p*i.q)}</span></div>`).join('')}<hr>
 <div class="r"><span>Subtotal</span><span>${inr(b.c.sub)}</span></div>${b.c.d?`<div class="r"><span>Discount</span><span>−${inr(b.c.d)}</span></div>`:''}
 <div class="r"><span>CGST 2.5%</span><span>${inr(b.c.tx/2)}</span></div><div class="r"><span>SGST 2.5%</span><span>${inr(b.c.tx/2)}</span></div>
 <div class="r"><span>Round off</span><span>${inr(b.c.round)}</span></div><hr>
 <div class="r big"><span>Total</span><span>${inr(b.c.total)}</span></div><div class="r"><span>Paid by</span><span>${b.pay}</span></div>
 <div class="qr"></div><div class="c" style="margin-top:6px">Scan to rate your visit<br>Thank you, see you again!</div>`;
 $('modal').classList.add('show')}
function sendTo(kind){const b=cur;
 if(kind==='wa'){if(!b.phone)return toast('Add the customer phone number first.');toast('PDF bill '+b.no+' sent on WhatsApp to '+b.phone)}
 else{if(!b.email)return toast('Add the customer email first.');toast('PDF bill '+b.no+' emailed to '+b.email)}}
$('wa').onclick=()=>sendTo('wa');$('em').onclick=()=>sendTo('em');
$('pr').onclick=()=>{try{window.print()}catch(e){toast('Printing is blocked here. It works in the live app.')}};
$('cl').onclick=()=>{$('modal').classList.remove('show');S.cart={};S.disc=0;['coupon','phone','email'].forEach(i=>$(i).value='');drawCart();drawSales()};

function drawSales(){
 const tot=S.bills.reduce((a,b)=>a+b.c.total,0),cnt=S.bills.length,cnt2={};
 S.bills.forEach(b=>b.items.forEach(i=>cnt2[i.n]=(cnt2[i.n]||0)+i.q));
 const top=Object.entries(cnt2).sort((a,b)=>b[1]-a[1])[0];
 $('stats').innerHTML=`<div><b>${inr(tot)}</b><span>Sales</span></div><div><b>${cnt}</b><span>Bills</span></div><div><b>${top?top[0]:'–'}</b><span>Top item</span></div>`;
 $('nobills').style.display=cnt?'none':'block';
 $('bills').innerHTML=S.bills.map((b,i)=>`<tr><td>${b.no}</td><td>${b.now.toLocaleTimeString('en-IN',{timeStyle:'short'})}</td><td>${b.type}</td><td>${b.pay}</td><td>${inr(b.c.total)}</td><td><button class="ghost" data-i="${i}">View</button></td></tr>`).join('')}
$('bills').onclick=e=>{const b=e.target.closest('button');if(b){cur=S.bills[b.dataset.i];showBill()}};
function tab(n){$('v1').style.display=n===1?'':'none';$('v2').style.display=n===2?'':'none';$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);if(n===2)drawSales()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
seg($('otype'),TYPES,'type');seg($('pmode'),PAYS,'pay');tableState();drawMenu();drawCart();
</script>
</body>
</html>
